<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="TIGPS 開放日互動遊戲：你以為 vs. 數據說">
<title>你以為的數位世代</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; each screen is a card stack. Two signal colors = 孩子 vs 大人 throughout. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#15203A; --muted:#5A6377; --line:#DCE1EA;
  --kid:#0F8A7E; --adult:#C97A10; --accent:#2D47C9; --accent-ink:#FFFFFF;
  --ok:#1E8A4C; --ok-bg:#E3F4EA; --no:#B23A3A; --no-bg:#FBE9E7; --soft:#E8ECF7;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#172036; --ink:#E7EBF4; --muted:#9BA4B9; --line:#2A3550;
  --kid:#3CC6B3; --adult:#F0B04A; --accent:#8098FF; --accent-ink:#0E1424;
  --ok:#5DD08D; --ok-bg:#163526; --no:#F08B84; --no-bg:#3A1E22; --soft:#1F2A45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172036; --ink:#E7EBF4; --muted:#9BA4B9; --line:#2A3550;
  --kid:#3CC6B3; --adult:#F0B04A; --accent:#8098FF; --accent-ink:#0E1424;
  --ok:#5DD08D; --ok-bg:#163526; --no:#F08B84; --no-bg:#3A1E22; --soft:#1F2A45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* start */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.hero h1{font-size:clamp(30px,8vw,42px);font-weight:900;letter-spacing:.01em}
.hero h1 .k{color:var(--kid)} .hero h1 .a{color:var(--adult)}
.wave{width:100%;height:56px;display:block}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 12px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink);font-weight:700}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px}
.mode strong{font-size:17px;display:block}
.mode .go{font-family:var(--f-num);font-weight:700;color:var(--accent);flex:none}
.mode:hover{border-color:var(--accent)}
.facets{display:flex;flex-wrap:wrap;gap:8px}
.facet{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--muted);border:1px solid transparent}
.facet.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* question */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.qtext{font-size:clamp(20px,5.4vw,24px);font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-size:17px;transition:border-color .15s,background .15s}
.opt .L{font-family:var(--f-num);font-weight:700;color:var(--muted);flex:none;width:1.4em}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .L{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.tags{display:flex;gap:6px;margin-left:auto;flex:none}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;color:#fff;white-space:nowrap}
.tag.k{background:var(--kid)} .tag.a{background:var(--adult)} .tag.me{background:var(--accent);color:var(--accent-ink)}
.turn{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%}

/* reveal */
.verdict{font-size:20px;font-weight:900}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.reveal{font-size:19px;font-weight:700;line-height:1.55}
.viz{display:flex;flex-direction:column;gap:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.row{display:flex;flex-direction:column;gap:4px}
.row .lab{font-size:14px;font-weight:500}
.bar{display:grid;grid-template-columns:1fr 3.6em;align-items:center;gap:8px}
.track{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;width:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.val{font-family:var(--f-num);font-weight:700;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700;color:var(--accent)}
details ul{margin:10px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;font-weight:700;font-size:17px;width:100%}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-weight:500;width:100%}

/* end */
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-num);font-size:56px;line-height:1;color:var(--accent)}
.title-badge{font-size:24px;font-weight:900}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .card{padding:14px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:13px}
.who div{background:var(--soft);border-radius:10px;padding:10px 4px;font-weight:500}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;font-size:14px}
.list .m{flex:none;font-weight:700}
.foot{font-size:12px;color:var(--muted);text-align:center}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ages .chip{padding:9px 4px;font-size:14px}
.field{display:flex;flex-direction:column;gap:10px}
.field h3{font-size:15px}
.hint{font-size:13px;color:var(--no);min-height:1.2em}
.mode[aria-disabled="true"]{opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:26px;line-height:1.2;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
.live .stat b{font-size:clamp(28px,6vw,56px)}
.live{max-width:1100px}
.live-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.live-grid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: reduce){.fill,.progress i{transition:none}}
</style>

    <div class="ages" role="group" aria-label="${label||''}年齡">${AGES.map((a,i)=>`<button class="chip" id="${key}-a${i}" aria-pressed="${p.age===a}" data-k="${key}" data-age="${a}">${a}</button>`).join('')}</div>
  </div>`;
}
function bindProfile(rerender){
  app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{S[b.dataset.k].role=b.dataset.role;S.hint='';rerender()});
  app.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{S[b.dataset.k].age=b.dataset.age;S.hint='';rerender()});
}
const ready=p=>p.role&&p.age;
function bars(rows,opt={}){ // rows: [label, value, display]
  const max=opt.max||Math.max(1,...rows.map(r=>r[1]));
  return `<div class="viz">${rows.map(r=>`<div class="row"><span class="lab">${esc(r[0])}</span>
    <div class="bar"><div class="track"><div class="fill" data-w="${Math.max(r[1]/max*100,r[1]>0?1.5:0)}" style="background:${opt.color||'var(--accent)'}"></div></div><span class="val">${esc(r[2]??r[1])}</span></div></div>`).join('')}</div>`;
}
function animateBars(){requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%')))}

/* ---------- 首頁 ---------- */
function renderStart(){
  const ok=ready(S.me);
  app.innerHTML=`
  <section class="hero">
    <p class="eyebrow">TIGPS 臺灣數位世代青少年成長歷程追蹤研究</p>
    <h1>你以為的<span class="k">數位</span><span class="a">世代</span></h1>
    ${wave()}
    <p>我們訪問了全臺約 9,000 位國中生，也訪問了他們的爸媽、兄弟姊妹、老師和學校。同一件事，大家的答案常常不一樣。先猜猜看，再看數據怎麼說。</p>
  </section>
  <section class="card">${profileFields('me','先告訴我們你是誰')}</section>
  <section class="modes">
    <button class="mode" data-mode="quick" ${ok?'':'aria-disabled="true"'}><span><strong>快速挑戰</strong><span class="muted small">每一關 1 題，共 6 題，約 3 分鐘</span></span><span class="go">6 題 →</span></button>
    <button class="mode" data-mode="pair"><span><strong>親子默契挑戰</strong><span class="muted small">兩個人用同一支手機，各自作答，看誰比較懂數據、你們的答案有多像</span></span><span class="go">8 題 →</span></button>
    <button class="mode" data-mode="full" ${ok?'':'aria-disabled="true"'}><span><strong>完整版</strong><span class="muted small">六關 25 題全部玩完</span></span><span class="go">25 題 →</span></button>
  </section>
  <p class="hint" role="status">${esc(S.hint)}</p>
  <section style="display:flex;flex-direction:column;gap:8px">
    <p class="eyebrow">六個研究面向</p>
    <div class="facets">${DATA.levels.map(l=>`<span class="facet">${l.facet}</span>`).join('')}</div>
  </section>
  <p class="foot">不需要登入。我們只會匿名記錄身分、年齡區間和答對題數，用來統計參與情形，不會蒐集姓名、電話等個人資料。</p>`;
  bindProfile(renderStart);
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
    const m=b.dataset.mode;
    if(m==='pair'){S.screen='pairsetup';render();window.scrollTo(0,0);return}
    if(!ready(S.me)){S.hint='請先選擇身分和年齡，再開始挑戰。';renderStart();return}
    start(m);
  });
}
function renderPairSetup(){
  const ok=ready(S.kid)&&ready(S.adult);
  app.innerHTML=`
  <div class="top"><span class="eyebrow">親子默契挑戰</span></div>
  <section class="card" style="border-top:4px solid var(--kid)">${profileFields('kid','玩家一：孩子')}</section>
  <section class="card" style="border-top:4px solid var(--adult)">${profileFields('adult','玩家二：大人')}</section>
  <p class="hint" role="status">${esc(S.hint)}</p>
  <button class="primary" id="go">開始挑戰</button>
  <button class="ghost" id="back">回到首頁</button>`;
  bindProfile(renderPairSetup);
  document.getElementById('go').onclick=()=>{if(!ok){S.hint='請兩位都選擇身分和年齡。';renderPairSetup();return}start('pair')};
  document.getElementById('back').onclick=()=>{S.hint='';S.screen='start';render()};
}
function start(mode){
  S.mode=mode;S.list=buildList(mode);S.i=0;S.ans=[];S.turn=0;S.picks=[null,null];S.hint='';S.sid=sidNew();S.sent=false;S.stats=null;S.statsErr=false;
  const base={event:'start',sid:S.sid,mode};
  send(mode==='pair'?[{...base,player:'kid',...S.kid},{...base,player:'adult',...S.adult}]:[{...base,player:'',...S.me}]);
  S.screen='q';render();window.scrollTo(0,0);
}

/* ---------- 題目與揭曉 ---------- */
function header(q){
  const lv=DATA.levels[q.lv],pct=(S.i)/S.list.length*100;
  return `<div class="top"><span class="eyebrow">第 ${q.lv+1} 關｜${esc(lv.title)}</span><span class="small muted num">${S.i+1} / ${S.list.length}</span></div>
  <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
}
function renderQ(){
  const q=Q(S.list[S.i]),pair=S.mode==='pair';
  const who=pair?(S.turn===0?['kid','孩子先選','（大人先別看）']:['adult','換大人選','（孩子先別看）']):null;
  app.innerHTML=`${header(q)}
  <section class="card" style="display:flex;flex-direction:column;gap:16px">
    ${pair?`<div class="turn"><span class="dot" style="background:var(--${who[0]})"></span>${who[1]}<span class="muted small" style="font-weight:400">${who[2]}</span></div>`:''}
    <h2 class="qtext">${esc(q.q)}</h2>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${'ABCDE'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}
function choose(i){
  if(S.mode==='pair'){S.picks[S.turn]=i;if(S.turn===0){S.turn=1;renderQ();window.scrollTo(0,0);return}}
  else S.picks=[i,null];
  const q=Q(S.list[S.i]);S.ans.push({n:q.n,p:S.picks.slice()});S.screen='r';render();window.scrollTo(0,0);
}
function vizHTML(v){
  const two=v.rows[0].length>2,unit=v.unit||'%',max=v.max||100;
  const cols=two?['var(--kid)','var(--adult)']:['var(--accent)'];
  const fmt=x=>unit==='%'?x.toFixed(1)+'%':x.toFixed(2)+' '+unit;
  return `<div class="viz">
  <div class="legend">${v.legend.map((l,i)=>`<span><i class="sw" style="background:${cols[i]}"></i>${esc(l)}</span>`).join('')}<span>${esc(v.note)}</span></div>
  ${v.rows.map(r=>`<div class="row"><span class="lab">${esc(r[0])}</span>
    ${r.slice(1).map((x,i)=>`<div class="bar"><div class="track"><div class="fill" data-w="${Math.max(x/max*100,0.8)}" style="background:${cols[i]}"></div></div><span class="val">${fmt(x)}</span></div>`).join('')}
  </div>`).join('')}</div>`;
}
function renderR(){
  const q=Q(S.list[S.i]),pair=S.mode==='pair',p=S.ans[S.ans.length-1].p;
  let verdict;
  if(pair){const k=p[0]===q.ans,a=p[1]===q.ans;verdict=k&&a?['ok','兩個人都猜對了']:k?['ok','孩子猜對了']:a?['ok','大人猜對了']:['no','兩個人都被數據考倒了']}
  else verdict=p[0]===q.ans?['ok','猜對了']:['no','跟你想的不一樣'];
  app.innerHTML=`${header(q)}
  <section class="card" style="display:flex;flex-direction:column;gap:14px">
    <p class="verdict ${verdict[0]}">${verdict[1]}</p>
    <h2 style="font-size:16px;font-weight:500" class="muted">${esc(q.q)}</h2>
    <div class="opts">${q.opts.map((o,i)=>{
      const tags=[];if(pair){if(p[0]===i)tags.push('<span class="tag k">孩子</span>');if(p[1]===i)tags.push('<span class="tag a">大人</span>')}else if(p[0]===i)tags.push('<span class="tag me">你選</span>');
      const cls=i===q.ans?'correct':(p.includes(i)?'wrong':'');
      return `<button class="opt ${cls}" disabled><span class="L">${'ABCDE'[i]}</span><span>${esc(o)}</span><span class="tags">${tags.join('')}</span></button>`}).join('')}</div>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:16px">
    <p class="reveal">${esc(q.reveal)}</p>
    ${vizHTML(q.viz)}
    <details><summary>看完整數據</summary><ul>${q.data.map(d=>`<li>${esc(d)}</li>`).join('')}</ul><p class="small muted" style="margin-top:10px">資料來源：${esc(q.src)}</p></details>
  </section>
  <button class="primary" id="next">${S.i+1<S.list.length?'下一題':'看結果'}</button>`;
  animateBars();
  document.getElementById('next').onclick=()=>{S.i++;S.turn=0;S.picks=[null,null];S.screen=S.i<S.list.length?'q':'end';render();window.scrollTo(0,0)};
}

/* ---------- 結果與現場統計 ---------- */
function titleFor(r){return r>=.8?['數據讀心師','你對數位世代的直覺，跟研究數據很接近。']:r>=.5?['敏銳觀察家','有些答案你猜中了，有些讓你重新認識了身邊的人。']:['重新認識的開始','很多答案和直覺不一樣，這正是做研究的理由。']}
const scoreOf=k=>S.ans.filter(a=>a.p[k]===Q(a.n).ans).length;
const answersStr=k=>S.ans.map(a=>a.n+':'+(a.p[k]===Q(a.n).ans?1:0)).join(',');
function finishOnce(){
  if(S.sent) return Promise.resolve();
  S.sent=true;const n=S.ans.length,base={event:'finish',sid:S.sid,mode:S.mode,total:n};
  const rows=S.mode==='pair'
    ?[{...base,player:'kid',...S.kid,score:scoreOf(0),answers:answersStr(0)},{...base,player:'adult',...S.adult,score:scoreOf(1),answers:answersStr(1)}]
    :[{...base,player:'',...S.me,score:scoreOf(0),answers:answersStr(0)}];
  return send(rows);
}
function pctRank(list,p){if(!list||!list.length)return null;const below=list.filter(x=>x<p).length;return Math.round(below/list.length*100)}
function crowdHTML(st,mine){
  if(!st) return `<p class="small muted">${S.statsErr?'現場統計暫時連不上，稍後再試試看。':'正在讀取現場統計……'}</p>`;
  const ageRows=AGES.filter(a=>st.age[a]).map(a=>[a,st.age[a],st.age[a]+' 人']);
  const roleRows=ROLES.filter(r=>st.role[r]).map(r=>[r,st.role[r],st.role[r]+' 人']);
  const rank=mine!=null?pctRank(st.pctList,mine):null;
  return `<div class="stats">
      <div class="stat"><b>${st.starts}</b><span>參加人次</span></div>
      <div class="stat"><b>${st.finishes}</b><span>完成挑戰</span></div>
      <div class="stat"><b>${st.avgPct??'—'}${st.avgPct!=null?'%':''}</b><span>平均答對率</span></div></div>
    ${rank!=null?`<p>你的答對率贏過 <b class="num">${rank}%</b> 的參加者。</p>`:''}
    ${roleRows.length?`<h3 style="font-size:15px">參加者身分</h3>${bars(roleRows)}`:''}
    ${ageRows.length?`<h3 style="font-size:15px">參加者年齡</h3>${bars(ageRows,{color:'var(--kid)'})}`:''}`;
}
function renderEnd(){
  const pair=S.mode==='pair',n=S.ans.length;
  const lvSeen=new Set(S.ans.map(a=>Q(a.n).lv)),same=S.ans.filter(a=>a.p[0]===a.p[1]).length;
  const best=pair?Math.max(scoreOf(0),scoreOf(1)):scoreOf(0),t=titleFor(best/n);
  const mine=pair?null:Math.round(scoreOf(0)/n*100);
  app.innerHTML=`
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <p class="eyebrow">挑戰完成</p>
    ${pair?`<div class="pairs">
      <div class="card"><p class="small" style="color:var(--kid);font-weight:700">孩子答對</p><p class="num" style="font-size:36px;font-weight:700">${scoreOf(0)}<span class="small muted"> / ${n}</span></p><p class="small muted">${esc(S.kid.role)}・${esc(S.kid.age)}</p></div>
      <div class="card"><p class="small" style="color:var(--adult);font-weight:700">大人答對</p><p class="num" style="font-size:36px;font-weight:700">${scoreOf(1)}<span class="small muted"> / ${n}</span></p><p class="small muted">${esc(S.adult.role)}・${esc(S.adult.age)}</p></div></div>
      <p>你們有 <b class="num">${same}</b> 題選了一樣的答案，默契指數 <b class="num">${Math.round(same/n*100)}</b> 分。</p>`
    :`<div class="score"><b>${scoreOf(0)}</b><span class="muted">/ ${n} 題答對</span></div><p class="small muted">${esc(S.me.role)}・${esc(S.me.age)}</p>`}
    <p class="title-badge">${t[0]}</p><p>${t[1]}</p>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px" id="crowd">
    <h2 style="font-size:17px">現場大家玩得怎麼樣？</h2>
    <div id="crowdBody" style="display:flex;flex-direction:column;gap:12px">${crowdHTML(S.stats,mine)}</div>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2 style="font-size:17px">你解鎖的研究面向</h2>
    <div class="facets">${DATA.levels.map((l,i)=>`<span class="facet ${lvSeen.has(i)?'on':''}">${l.facet}</span>`).join('')}</div>
    <ul class="list">${S.ans.map(a=>{const q=Q(a.n),ok=pair?(a.p[0]===q.ans||a.p[1]===q.ans):a.p[0]===q.ans;return `<li><span class="m" style="color:var(--${ok?'ok':'no'})">${ok?'✓':'✗'}</span><span>${esc(q.reveal)}</span></li>`}).join('')}</ul>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2 style="font-size:17px">這些數字從哪裡來？</h2>
    <p>「臺灣數位世代青少年的成長歷程追蹤研究」（TIGPS）從 2023 年起，每年追蹤同一群國中生，並同時訪問他們身邊的人：</p>
    <div class="who"><div>國中生</div><div>家長</div><div>兄弟姊妹</div><div>導師</div><div>科任老師</div><div>學校</div></div>
    <p class="small muted">同一個家庭、同一個班級的答案可以互相對照，所以才看得到「你以為」和「實際上」的差距。</p>
  </section>
  <button class="primary" id="again">再玩一次</button>
  <button class="ghost" id="home">回到首頁</button>
  <p class="foot">數據為描述性統計；學生資料以抽樣權數加權。題目中的比例代表填答者自己的看法。</p>`;
  animateBars();
  document.getElementById('again').onclick=()=>start(S.mode);
  document.getElementById('home').onclick=()=>{S.screen='start';render();window.scrollTo(0,0)};
  if(!S.stats){
    finishOnce().then(()=>getStats()).then(st=>{S.stats=st}).catch(()=>{S.statsErr=true}).then(()=>{
      const el=document.getElementById('crowdBody');if(el&&S.screen==='end'){el.innerHTML=crowdHTML(S.stats,mine);animateBars()}
    });
  }
}

/* ---------- 大螢幕統計（網址加上 #live） ---------- */
let liveTimer=null;
function renderLive(){
  app.classList.add('live');
  const st=S.stats;
  let worst='';
  if(st&&st.perQ){
    const rows=Object.entries(st.perQ).filter(([,o])=>o.n>=3).map(([q,o])=>[+q,o.ok/o.n*100,o.n]).sort((a,b)=>a[1]-b[1]).slice(0,6);
    worst=rows.length?bars(rows.map(([q,p,n])=>[`Q${q}　${Q(q).q}`,p,p.toFixed(0)+'%']),{max:100,color:'var(--no)'}):'<p class="small muted">累積更多作答後，這裡會列出最多人猜錯的題目。</p>';
  }
  app.innerHTML=`
  <section class="hero"><p class="eyebrow">TIGPS 開放日｜現場即時統計</p><h1>你以為的<span class="k">數位</span><span class="a">世代</span></h1></section>
  ${st?`<div class="stats">
      <div class="stat"><b>${st.starts}</b><span>參加人次</span></div>
      <div class="stat"><b>${st.finishes}</b><span>完成挑戰</span></div>
      <div class="stat"><b>${st.avgPct??'—'}${st.avgPct!=null?'%':''}</b><span>平均答對率</span></div></div>
    <div class="live-grid">
      <section class="card"><h2 style="font-size:18px;margin-bottom:12px">參加者身分</h2>${bars(ROLES.map(r=>[r,st.role[r]||0,(st.role[r]||0)+' 人']))}</section>
      <section class="card"><h2 style="font-size:18px;margin-bottom:12px">參加者年齡</h2>${bars(AGES.map(a=>[a,st.age[a]||0,(st.age[a]||0)+' 人']),{color:'var(--kid)'})}</section>
      <section class="card"><h2 style="font-size:18px;margin-bottom:12px">答對題數分布</h2>${bars(['答對 0–19%','20–39%','40–59%','60–79%','80–100%'].map((l,i)=>[l,st.scoreBuckets[i],st.scoreBuckets[i]+' 人']),{color:'var(--adult)'})}</section>
      <section class="card"><h2 style="font-size:18px;margin-bottom:12px">最多人猜錯的題目（答對率）</h2>${worst}</section>
    </div>
    <p class="foot">每 30 秒自動更新。最後更新：${new Date(st.updated).toLocaleTimeString('zh-TW')}</p>`
  :`<p class="muted">${S.statsErr?'統計暫時連不上，30 秒後會自動重試。':(hasApi()?'正在讀取統計……':'尚未設定統計網址（API_URL），請見 README.md。')}</p>`}`;
  animateBars();
}
function startLive(){
  const tick=()=>getStats().then(st=>{S.stats=st;S.statsErr=false}).catch(()=>{S.statsErr=true}).then(()=>{if(S.screen==='live')renderLive()});
  clearInterval(liveTimer);tick();liveTimer=setInterval(tick,30000);
}

function render(){
  if(S.screen!=='live'){app.classList.remove('live');clearInterval(liveTimer)}
  ({start:renderStart,pairsetup:renderPairSetup,q:renderQ,r:renderR,end:renderEnd,live:renderLive})[S.screen]();
}
function route(){if(location.hash==='#live'){S.screen='live';S.stats=null;render();startLive()}else if(S.screen==='live'){S.screen='start';render()}}
window.addEventListener('hashchange',route);
function boot(d){if(d&&d.S)S=d.S;if(location.hash==='#live')route();else render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
